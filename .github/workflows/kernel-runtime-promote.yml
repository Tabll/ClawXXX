name: Promote kernel catalog

on:
  # workflow_run is OR: the read-only gate explicitly joins the exact source SHA.
  workflow_run:
    workflows: [Build signed kernel runtimes, Electron E2E]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Publish an accepted build, or renew metadata and clean due retired packages
        type: choice
        options: [publish, maintain]
        default: publish
      staging-run-id:
        description: Exact successful full runtime build run ID (required for publish)
        required: false
      expected-source-sha:
        description: Optional additional assertion of the artifact source SHA
        required: false
      bootstrap:
        description: Explicitly authorize first publication only when there is no existing signed catalog
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Covers publishing, catalog renewal and retirement, including approval waits.
concurrency:
  group: kernel-runtime-production-catalog
  cancel-in-progress: false

jobs:
  acceptance:
    name: Read-only release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      mode: ${{ steps.gate.outputs.mode }}
      run-id: ${{ steps.gate.outputs.run-id }}
      source-sha: ${{ steps.gate.outputs.source-sha }}
      candidate-digest: ${{ steps.gate.outputs.candidate-digest }}
      artifact-ids: ${{ steps.gate.outputs.artifact-ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publisher code is reviewed main, NOT the artifact's possibly older SHA.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify frozen publisher source inputs
        run: node scripts/kernel-runtime/verify-sources.mjs
      - name: Join complete runtime acceptance and same-source Electron E2E
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
          STAGING_RUN_ID: ${{ inputs['staging-run-id'] }}
          EXPECTED_SOURCE_SHA: ${{ inputs['expected-source-sha'] }}
          CANDIDATE_OUTPUT: accepted-candidate.json
        run: node scripts/kernel-runtime/lib/release-gate.mjs
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.mode == 'publish' && steps.gate.outputs.eligible == 'true'
        with:
          name: kernel-release-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted-candidate.json
          retention-days: 90

  promote:
    name: Publish verified runtimes and safely retire old packages
    needs: acceptance
    if: needs.acceptance.outputs.eligible == 'true'
    environment: kernel-production
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install frozen publication tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        if: needs.acceptance.outputs.mode == 'publish'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.acceptance.outputs.run-id }}
          artifact-ids: ${{ needs.acceptance.outputs.artifact-ids }}
          merge-multiple: false
          path: temp/approved-artifacts
      - name: Materialize public release trust roots
        env:
          CLAWX_KERNEL_TRUST_KEYS_B64: ${{ secrets.CLAWX_KERNEL_TRUST_KEYS_B64 }}
        run: >-
          node scripts/kernel-runtime/build-trust-store.mjs
          --channel production
          --output temp/roots.production.json
      - name: Revalidate, publish immutable assets, replace signed catalogs, then clean safely
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.acceptance.outputs.mode }}
          STAGING_RUN_ID: ${{ needs.acceptance.outputs.run-id }}
          EXPECTED_SOURCE_SHA: ${{ needs.acceptance.outputs.source-sha }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.acceptance.outputs.candidate-digest }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
          CLAWX_CATALOG_SIGNING_KEY_ID: ${{ secrets.CLAWX_CATALOG_SIGNING_KEY_ID }}
          CLAWX_CATALOG_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CLAWX_CATALOG_SIGNING_PRIVATE_KEY_B64 }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: node scripts/kernel-runtime/publish-runtimes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            temp/kernel-production-evidence/
            temp/roots.production.json
          if-no-files-found: warn
          retention-days: 90
