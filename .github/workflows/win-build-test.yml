name: Windows Build Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for SignPath parameter (e.g., 1.0.0-test.1)"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  windows-build-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      - name: Materialize Windows release signing certificate
        shell: pwsh
        env:
          CLAWX_WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.CLAWX_WINDOWS_SIGNING_CERT_PFX_B64 }}
        run: |
          if (-not $env:CLAWX_WINDOWS_SIGNING_CERT_PFX_B64) { throw "Missing Windows release signing certificate" }
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          [IO.File]::WriteAllBytes("temp/windows-release-signing.pfx", [Convert]::FromBase64String($env:CLAWX_WINDOWS_SIGNING_CERT_PFX_B64))

      - name: Build Windows
        env:
          CSC_LINK: temp/windows-release-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CLAWX_WINDOWS_SIGNING_CERT_PASSWORD }}
        run: pnpm run package:win:release

      - name: Remove Windows release signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath temp/windows-release-signing.pfx -Force -ErrorAction SilentlyContinue

      - name: Install, live-update and uninstall signed package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $installer) { throw "Signed Windows installer not found" }
          ./scripts/windows-packaged-smoke.ps1 -InstallerPath $installer.FullName

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.exe
            release/latest*.yml
          retention-days: 7
