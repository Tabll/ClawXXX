# ClawX Release Workflow
# Builds and publishes releases for macOS, Windows, and Linux

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # Fails fast on tag pushes if package.json "version" does not match the tag.
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Assert tag matches package.json
        run: node scripts/assert-tag-matches-package.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Run complete unit, contract, type, lint, chaos, comms and Harness release validation
        run: pnpm run test && pnpm run release:multi-kernel:validate

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/comms
            artifacts/harness
          if-no-files-found: warn
          retention-days: 14

  validate-kernel-distribution:
    needs: validate-release
    environment: kernel-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Materialize production kernel public trust roots
        env:
          CLAWX_KERNEL_TRUST_KEYS_B64: ${{ secrets.CLAWX_KERNEL_TRUST_KEYS_B64 }}
        run: >-
          node scripts/kernel-runtime/build-trust-store.mjs
          --channel production
          --output temp/roots.production.json

      - name: Require both signed catalogs and both immutable artifact mirrors to pass Range resume
        run: >-
          node scripts/kernel-runtime/distribution-drill.mjs
          --distribution resources/kernels/distribution.json
          --trust-store temp/roots.production.json
          --platform linux --arch x64
          --kernels openclaw,deepseek-harness

      - name: Upload live distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-kernel-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/roots.production.json
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [validate-release, validate-kernel-distribution]
    environment: kernel-production
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize production kernel public trust roots
        shell: bash
        env:
          CLAWX_KERNEL_TRUST_KEYS_B64: ${{ secrets.CLAWX_KERNEL_TRUST_KEYS_B64 }}
        run: >-
          node scripts/kernel-runtime/build-trust-store.mjs
          --channel production
          --output resources/kernels/trust/roots.production.json

      - name: Run Electron E2E on Linux before packaging
        if: matrix.platform == 'linux'
        env:
          CI: 'true'
          CLAWX_E2E_WORKERS: '2'
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a pnpm run test:e2e

      - name: Run Electron E2E on macOS before packaging
        if: matrix.platform == 'mac'
        env:
          CI: 'true'
          CLAWX_E2E_WORKERS: '2'
        run: pnpm run test:e2e

      - name: Run Electron E2E on Windows before packaging
        if: matrix.platform == 'win'
        env:
          CI: 'true'
          CLAWX_E2E_WORKERS: '2'
        run: pnpm run test:e2e

      - name: Upload release Electron E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Download uv binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run uv:download:mac

      - name: Download uv binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run uv:download:win

      - name: Download uv binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run uv:download:linux

      - name: Download agent-browser binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run agent-browser:download:mac

      - name: Download agent-browser binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run agent-browser:download:win

      - name: Download agent-browser binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run agent-browser:download:linux

      - name: Materialize Windows release signing certificate
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          CLAWX_WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.CLAWX_WINDOWS_SIGNING_CERT_PFX_B64 }}
        run: |
          if (-not $env:CLAWX_WINDOWS_SIGNING_CERT_PFX_B64) { throw "Missing Windows release signing certificate" }
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          [IO.File]::WriteAllBytes("temp/windows-release-signing.pfx", [Convert]::FromBase64String($env:CLAWX_WINDOWS_SIGNING_CERT_PFX_B64))


      # macOS specific steps
      - name: Free disk space (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          # Remove large pre-installed toolchains not needed for Electron builds
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/electron-builder/dmg-builder* || true
          # Homebrew cleanup
          brew cleanup --prune=all 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      # --publish never: prevent electron-builder from auto-publishing to GitHub.
      # All artifacts are collected and published atomically in the publish job.
      - name: Build macOS
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ulimit -n 65536
          echo "File descriptor limit: $(ulimit -n)"
          pnpm run package:mac:release

      - name: Verify macOS app signing, Gatekeeper and stapled notarization ticket
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' app_bundle; do
            count=$((count + 1))
            codesign --verify --deep --strict --verbose=4 "$app_bundle"
            spctl --assess --type execute --verbose=4 "$app_bundle"
            xcrun stapler validate "$app_bundle"
          done < <(find release -type d -name '*.app' -print0)
          test "$count" -gt 0

      # Windows specific steps
      - name: Build Windows
        if: matrix.platform == 'win'
        env:
          CSC_LINK: temp/windows-release-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CLAWX_WINDOWS_SIGNING_CERT_PASSWORD }}
        run: pnpm run package:win:release

      - name: Remove Windows release signing certificate
        if: always() && matrix.platform == 'win'
        shell: pwsh
        run: Remove-Item -LiteralPath temp/windows-release-signing.pfx -Force -ErrorAction SilentlyContinue

      - name: Verify, install, live-update and uninstall signed Windows package
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $installer) { throw "Signed Windows installer not found" }
          ./scripts/windows-packaged-smoke.ps1 -InstallerPath $installer.FullName

      # Linux specific steps
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            !release/builder-debug.yml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job: Publish to GitHub Releases
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: release
    runs-on: ubuntu-latest
    
    steps:
      - name: Download release artifacts only
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: List all downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          find release-artifacts/ -type f -exec ls -lh {} \;
          echo ""
          echo "=== File tree ==="
          tree release-artifacts/ || find release-artifacts/ -print

      - name: Remove duplicate builder-debug files
        run: |
          echo "Removing builder-debug.yml files to avoid duplicate asset upload conflicts..."
          find release-artifacts/ -name "builder-debug.yml" -delete -print || true

      - name: Create GitHub Release (as pre-release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.yml
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## 🚀 ClawX ${{ github.ref_name }}
            
            ClawX - Extensible multi-kernel graphical AI assistant
            
            ### 📦 Downloads
            
            Please select the appropriate installer for your operating system and architecture:
            
            #### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `ClawX-*-mac-arm64.dmg`
            - **Intel (x64)**: `ClawX-*-mac-x64.dmg`
            
            #### Windows
            - **Installer (x64)**: `ClawX-*-win-x64.exe`
            
            #### Linux
            - **AppImage (x64)**: `ClawX-*-linux-x86_64.AppImage` (Universal format, recommended)
            - **AppImage (ARM64)**: `ClawX-*-linux-arm64.AppImage`
            - **Debian/Ubuntu (x64)**: `ClawX-*-linux-amd64.deb`
            - **Debian/Ubuntu (ARM64)**: `ClawX-*-linux-arm64.deb`
            - **RPM (x64)**: `ClawX-*-linux-x86_64.rpm`
            
            ### 📝 Release Notes
            
            See the auto-generated release notes below for detailed changes.
            
            ### ⚠️ Installation Notes
            
            - **macOS**: Release CI requires Developer ID signing, Gatekeeper assessment, and a stapled notarization ticket. Do not use an unsigned fallback artifact.
            - **Windows**: Release CI requires Authenticode on the installed app and installer. Do not use an unsigned fallback artifact.
            - **Linux AppImage**: First run `chmod +x ClawX-*.AppImage` to add execute permission. On Ubuntu 22.04 you may also need `sudo apt install libfuse2`; on Ubuntu 24.04 use `sudo apt install libfuse2t64`
            - **Linux .deb (Ubuntu 24.04)**: If installation fails due to missing dependencies, use `sudo apt install libgtk-3-0t64 libnotify4t64 libxss1t64` before installing
            
            ---
            
            💬 Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Job: Upload to Tencent Cloud COS
  # Uploads all release artifacts to COS for:
  #   - Official website downloads (via release-info.json)
  #   - electron-updater auto-update (via {channel}-*.yml)
  #
  # Directory structure under the COS clawxxx prefix (channel-separated):
  #   latest/          → stable releases (latest.yml, latest-mac.yml, …)
  #   alpha/           → alpha  releases (alpha.yml,  alpha-mac.yml, …)
  #   beta/            → beta   releases (beta.yml,   beta-mac.yml,  …)
  #   releases/vX.Y.Z/ → permanent archive, never deleted
  # ──────────────────────────────────────────────────────────────
  upload-cos:
    needs: release
    environment: kernel-production
    runs-on: ubuntu-latest

    env:
      TENCENT_COS_BUCKET: aq-pub-1252262977
      TENCENT_COS_REGION: ap-shanghai
      TENCENT_COS_ROOT_PREFIX: clawxxx
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

    steps:
      - name: Checkout COS publishing tooling
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frozen COS publishing tooling
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts only
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: Extract version and channel
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          # Detect channel from semver prerelease tag
          # e.g. 0.1.8-alpha.0 → alpha, 1.0.0-beta.1 → beta, 1.0.0 → latest
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}, channel: ${CHANNEL}"

      - name: Prepare upload directories
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          mkdir -p staging/${CHANNEL}
          mkdir -p staging/releases/${TAG}

          # Flatten all platform artifacts into staging directories
          find release-artifacts/ -type f | while read file; do
            filename=$(basename "$file")
            cp "$file" "staging/${CHANNEL}/${filename}"
            cp "$file" "staging/releases/${TAG}/${filename}"
          done

          echo "=== staging/${CHANNEL}/ ==="
          ls -lh staging/${CHANNEL}/
          echo ""
          echo "=== staging/releases/${TAG}/ ==="
          ls -lh staging/releases/${TAG}/

      # Note: Do NOT rename yml files. electron-updater (generic provider) always
      # requests "latest-mac.yml", "latest.yml", etc. regardless of feed URL.
      # Channel separation is achieved by directory: /alpha/, /beta/, /latest/.
      - name: Verify yml files present
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"
          echo "=== staging/${CHANNEL}/ (update metadata) ==="
          ls -la staging/${CHANNEL}/*.yml 2>/dev/null || echo "No yml files found (check electron-builder outputs)"

      - name: Generate release-info.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          BASE_URL="https://aq-pub-1252262977.cos.ap-shanghai.tencentcos.cn/clawxxx/${CHANNEL}"

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE_URL" \
            --arg changelog "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            '{
              version: $version,
              channel: $channel,
              releaseDate: $date,
              downloads: {
                mac: {
                  x64: ($base + "/ClawX-" + $version + "-mac-x64.dmg"),
                  arm64: ($base + "/ClawX-" + $version + "-mac-arm64.dmg")
                },
                win: {
                  x64: ($base + "/ClawX-" + $version + "-win-x64.exe"),
                  arm64: ($base + "/ClawX-" + $version + "-win-arm64.exe")
                },
                linux: {
                  deb_amd64: ($base + "/ClawX-" + $version + "-linux-amd64.deb"),
                  deb_arm64: ($base + "/ClawX-" + $version + "-linux-arm64.deb"),
                  appimage_x64: ($base + "/ClawX-" + $version + "-linux-x86_64.AppImage"),
                  appimage_arm64: ($base + "/ClawX-" + $version + "-linux-arm64.AppImage"),
                  rpm_x64: ($base + "/ClawX-" + $version + "-linux-x86_64.rpm")
                }
              },
              changelog: $changelog
            }' > staging/${CHANNEL}/release-info.json

          echo "=== release-info.json ==="
          cat staging/${CHANNEL}/release-info.json

      - name: Verify the protected Tencent COS target before any external write
        run: node scripts/tencent-cos.mjs verify-bucket

      - name: "Upload immutable Tencent COS archive: releases/vX.Y.Z/"
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          node scripts/tencent-cos.mjs put-directory-immutable --source "staging/releases/${TAG}" --prefix "releases/${TAG}"

      - name: "Sync Tencent COS channel metadata last: {channel}/"
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"
          node scripts/tencent-cos.mjs sync-channel --source "staging/${CHANNEL}" --channel "${CHANNEL}"

      - name: Verify Tencent COS upload
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          echo "=== ${CHANNEL}/ ==="
          node scripts/tencent-cos.mjs list --prefix "${CHANNEL}/" > temp-cos-channel.json
          jq -e '.ok and (.result | length > 0)' temp-cos-channel.json

          echo ""
          echo "=== releases/${TAG}/ ==="
          node scripts/tencent-cos.mjs list --prefix "releases/${TAG}/" > temp-cos-release.json
          jq -e '.ok and (.result | length > 0)' temp-cos-release.json

          echo ""
          echo "=== Verify release-info.json ==="
          node scripts/tencent-cos.mjs get --key "${CHANNEL}/release-info.json" --output /tmp/release-info.json
          jq . /tmp/release-info.json

          echo ""
          echo "=== Verify update yml ==="
          if [ "${CHANNEL}" = "latest" ]; then
            YML_PREFIX="latest"
          else
            YML_PREFIX="${CHANNEL}"
          fi
          echo "electron-updater expects ${YML_PREFIX}-mac.yml, ${YML_PREFIX}.yml, etc. in ${CHANNEL}/:"
          jq -e --arg prefix "clawxxx/${CHANNEL}/${YML_PREFIX}" '.result | map(.Key) | any(startswith($prefix) and endswith(".yml"))' temp-cos-channel.json
          
          echo ""
          echo "All files uploaded and verified successfully!"

  # ──────────────────────────────────────────────────────────────
  # Job: Finalize Release
  # Promotes the GitHub Release from pre-release to latest AFTER
  # both GitHub Release assets and COS uploads are fully complete.
  # This ensures /releases/latest API never returns an incomplete
  # release — the website and electron-updater only see it when
  # all platform artifacts are ready.
  # ──────────────────────────────────────────────────────────────
  finalize:
    needs: [publish, upload-cos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Promote release from pre-release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IS_PRERELEASE_CHANNEL=false

          if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
            IS_PRERELEASE_CHANNEL=true
          fi

          if [ "$IS_PRERELEASE_CHANNEL" = "true" ]; then
            echo "Tag $TAG is an alpha/beta release — keeping as pre-release."
          else
            echo "Promoting $TAG from pre-release to latest release..."
            gh release edit "$TAG" \
              --prerelease=false \
              --latest \
              --repo "${{ github.repository }}"
            echo "Release $TAG is now the latest release."
          fi
